# Fallback project generator.
#
# The checked-in Framewise.xcodeproj is hand-written and uses Xcode 16's
# synchronized folder groups, so it should open directly. If your Xcode is
# older, or the project file ever gets into a bad state, regenerate it:
#
#   brew install xcodegen
#   cd ios && xcodegen generate
#
# That rewrites Framewise.xcodeproj from this file with an explicit file list.
name: Framewise
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Framewise:
    type: application
    platform: iOS
    sources:
      - path: Framewise
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.framewise
        PRODUCT_NAME: Framewise
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Swift 5 language mode: the capture pipeline shares state across the
        # session, analysis and edit queues with explicit locks, which Swift 6
        # strict concurrency checking would reject outright.
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIStatusBarHidden: true
        INFOPLIST_KEY_UIRequiresFullScreen: true
        INFOPLIST_KEY_NSCameraUsageDescription: "Framewise needs the camera to show you the live frame, coach your composition, and take the photo."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Framewise saves your finished photos straight into your Photos library."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Framewise saves your finished photos into your Photos library and keeps them together in a Framewise album."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Framewise uses your location only to work out the sun's position, so it can tell you when golden hour starts and which way the light is coming from. Location is never stored or uploaded."
