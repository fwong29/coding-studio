<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello Studio</title>
  <style>
    :root {
      --bg: #092b24;
      --bg-glow: #14523f;
      --text: #eefcf6;
      --text-soft: #bbf7d0;
      --text-muted: #b7d9d2;
      --panel: linear-gradient(135deg, #2c5b52 0%, #163b36 100%);
      --panel-border: rgba(255,255,255,0.34);
      --shadow: rgba(0, 0, 0, 0.34);
      --accent: #9df7bd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 70% 10%, var(--bg-glow), transparent 24%),
  `=       radial-gradient(circle at 20% 90%, #33705b, transparent 20%),
        linear-gradient(135deg, #12362f 0%, var(--bg) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      max-width: 720px;
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 26px;
      padding: 56px 48px;
      text-align: center;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25), 0 24px 70px var(--shadow), 0 0 40px rgba(157, 247, 189, 0.14);
      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: "";
      position: absolute;
      inset: -12%;
      background: radial-gradient(circle, rgba(255,255,255,0.12), transparent 55%);
      pointer-events: none;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.4rem, 5vw, 4rem);
      line-height: 1.08;
      letter-spacing: -0.04em;
      color: var(--text);
    }

    p {
      margin: 0;
      font-size: 1.12rem;
      color: var(--text-soft);
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      margin-bottom: 24px;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.45);
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-soft);
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="badge">Coding Studio</div>
    <h1>Hello, Studio.</h1>
    <p>Welcome to your workspace. The site is live and ready for the next build.</p>
  </main>
</body>
</html>
