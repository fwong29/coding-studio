<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sky Sprint</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#72cff1;font-family:ui-monospace,monospace;color:white}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}#ui{position:fixed;inset:0;pointer-events:none;padding:20px;text-shadow:2px 2px #243e63;font-weight:bold;letter-spacing:1px}#ui div{display:flex;justify-content:space-between;max-width:760px;margin:auto;font-size:17px}#start{position:fixed;inset:0;display:grid;place-items:center;background:rgba(20,50,93,.25);z-index:2}.card{background:#183e70;border:5px solid #fff;outline:5px solid #183e70;padding:30px 45px;text-align:center;box-shadow:0 12px 0 #102b51}.card h1{margin:0;font-size:45px;letter-spacing:4px}.card p{line-height:1.7}button{font:inherit;font-weight:bold;font-size:16px;color:#183e70;background:#ffd94b;border:0;border-bottom:5px solid #c79720;padding:13px 24px;cursor:pointer}button:active{transform:translateY(4px);border-bottom-width:1px}
</style></head><body><canvas id="c"></canvas><div id="ui"><div><span id="world">WORLD 1-1</span><span id="coins">● 00</span><span id="time">TIME 300</span></div></div><div id="start"><div class="card" id="intro"><h1>SKY SPRINT</h1><p>Run to the flag. Avoid the cannon shots.<br><b>← → / A D</b> run &nbsp; <b>SPACE / W / ↑</b> jump</p><button>START RUN</button></div></div><script>
const c=document.querySelector('#c'),g=c.getContext('2d'),ui=document.querySelector('#start');let W,H,scale,started=false,last=0,time=300,cam=0,finish=false;const key={};addEventListener('keydown',e=>{key[e.key.toLowerCase()]=true;if([' ','arrowup','arrowleft','arrowright'].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>key[e.key.toLowerCase()]=false);function resize(){W=innerWidth;H=innerHeight;c.width=W;c.height=H;scale=Math.max(2,Math.floor(Math.min(W/480,H/270)))}addEventListener('resize',resize);resize();
const S=16,groundY=220,levelW=2620;let player,blocks,hazards,bills,coins,enemies;function reset(){player={x:58,y:groundY-18,w:14,h:18,vx:0,vy:0,on:false,face:1};blocks=[ [12,groundY,178,4,'ground'],[202,groundY,12,4,'ground'],[230,groundY-29,6,1,'brick'],[242,groundY-48,6,1,'brick'],[270,groundY,40,4,'ground'],[317,groundY-25,6,1,'brick'],[334,groundY-48,6,1,'brick'],[351,groundY-25,6,1,'brick'],[382,groundY,50,4,'ground'],[443,groundY-24,10,1,'brick'],[465,groundY-48,6,1,'brick'],[493,groundY,18,4,'ground'],[527,groundY,48,4,'ground'],[587,groundY-35,8,1,'brick'],[612,groundY,38,4,'ground'],[660,groundY,45,4,'ground'],[718,groundY-29,7,1,'brick'],[740,groundY-55,7,1,'brick'],[765,groundY,90,4,'ground'],[870,groundY,60,4,'ground'],[946,groundY-35,9,1,'brick'],[966,groundY,88,4,'ground'],[1070,groundY,75,4,'ground'],[1162,groundY-30,7,1,'brick'],[1180,groundY-55,7,1,'brick'],[1200,groundY,85,4,'ground'],[1300,groundY,80,4,'ground'],[1395,groundY-28,8,1,'brick'],[1420,groundY,100,4,'ground'],[1535,groundY,90,4,'ground']].map(a=>({x:a[0],y:a[1],w:a[2],h:a[3],type:a[4]}));hazards=[{x:287,y:groundY-14,w:12},{x:418,y:groundY-14,w:12},{x:546,y:groundY-14,w:12},{x:674,y:groundY-14,w:12},{x:820,y:groundY-14,w:12},{x:896,y:groundY-14,w:12},{x:1010,y:groundY-14,w:12},{x:1104,y:groundY-14,w:12},{x:1260,y:groundY-14,w:12},{x:1356,y:groundY-14,w:12},{x:1480,y:groundY-14,w:12}];enemies=[{x:278,y:groundY-18,w:16,h:16,minX:270,maxX:305,dir:1,speed:22},{x:430,y:groundY-18,w:16,h:16,minX:390,maxX:470,dir:-1,speed:24},{x:562,y:groundY-18,w:16,h:16,minX:535,maxX:585,dir:1,speed:26},{x:680,y:groundY-18,w:16,h:16,minX:663,maxX:705,dir:-1,speed:28},{x:952,y:groundY-18,w:16,h:16,minX:935,maxX:985,dir:1,speed:28},{x:1188,y:groundY-18,w:16,h:16,minX:1162,maxX:1215,dir:-1,speed:30},{x:1360,y:groundY-18,w:16,h:16,minX:1320,maxX:1415,dir:1,speed:30}];bills=[];coins=0;time=300;cam=0;finish=false}
function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function die(){reset();player.x=58;}
function tick(dt){if(!started||finish)return;time-=dt;if(time<0){die();return}let p=player,dir=(key.d||key.arrowright?1:0)-(key.a||key.arrowleft?1:0);p.vx+=(dir*115-p.vx)*Math.min(1,dt*12);if(dir)p.face=dir;if((key.w||key.arrowup||key[' '])&&p.on){p.vy=-238;p.on=false}p.vy+=570*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.on=false;for(const b of blocks){let oldY=p.y-p.vy*dt;if(rect(p,b)){if(p.vy>=0&&oldY+p.h<=b.y+2){p.y=b.y-p.h;p.vy=0;p.on=true}else if(p.vy<0&&oldY>=b.y+b.h-2){p.y=b.y+b.h;p.vy=0}else{p.x=p.vx>0?b.x-p.w:b.x+b.w;p.vx=0}}}for(const e of enemies){e.x+=e.speed*e.dir*dt;if(e.x<e.minX){e.x=e.minX;e.dir=1}else if(e.x+e.w>e.maxX){e.x=e.maxX-e.w;e.dir=-1}if(rect(p,e))die()}if(p.y>280||hazards.some(h=>rect(p,h)))die();if(Math.random()<dt*.45&&p.x>250){bills.push({x:p.x+320+Math.random()*130,y:groundY-13,w:18,h:9,vx:-125})}bills.forEach(b=>b.x+=b.vx*dt);bills=bills.filter(b=>b.x>cam-50);if(bills.some(b=>rect(p,b)))die();if(p.x>1515){finish=true;document.querySelector('#intro').innerHTML='<h1>YOU MADE IT!</h1><p>The Sky Sprint is complete.</p><button>RUN AGAIN</button>';ui.style.display='grid';document.querySelector('button').onclick=()=>{reset();ui.style.display='none';started=true}}cam=Math.max(0,Math.min(p.x-120,levelW-W/scale));document.querySelector('#time').textContent='TIME '+String(Math.max(0,Math.ceil(time))).padStart(3,'0');document.querySelector('#coins').textContent='● '+String(coins).padStart(2,'0')}
function box(x,y,w,h,col){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function draw(){let s=scale;g.setTransform(s,0,0,s,0,0);g.clearRect(0,0,W/s,H/s);let vw=W/s,vh=H/s;box(0,0,vw,vh,'#71cdec');for(let i=0;i<9;i++){let mx=(i*140-cam*.22)%(vw+160)-80;g.fillStyle='#b9e5ec';g.beginPath();g.arc(mx,126,70,Math.PI,0);g.fill()}for(const b of blocks){let X=b.x-cam;if(X+b.w<0||X>vw)continue;if(b.type==='ground'){box(X,b.y,b.w,b.h,'#6a9b34');box(X,b.y,b.w,3,'#b9dd50');box(X,b.y+3,b.w,b.h-3,'#9b5d32');for(let q=4;q<b.w;q+=9)box(X+q,b.y+7,1,1,'#c1783f')}else{box(X,b.y,b.w,b.h,'#a95b35');box(X+1,b.y+1,b.w-2,b.h-2,'#d47a43');g.strokeStyle='#813d2e';g.strokeRect(X+.5,b.y+.5,b.w-1,b.h-1)}}for(const h of hazards){let X=h.x-cam;box(X,h.y,h.w,h.w,'#d8383e');box(X+2,h.y+3,2,2,'#fff');box(X+8,h.y+3,2,2,'#fff');box(X+3,h.y+9,6,2,'#6e2537')}for(const e of enemies){let X=e.x-cam;g.fillStyle='#7a3c26';g.fillRect(X+2,e.y+5,e.w-4,e.h-8);g.fillStyle='#c96d41';g.fillRect(X+1,e.y+9,e.w-2,4);g.fillStyle='#2d1d18';g.fillRect(X+3,e.y+2,3,3);g.fillRect(X+e.w-6,e.y+2,3,3);g.fillStyle='#f6d1a4';g.fillRect(X+4,e.y+10,2,2);g.fillRect(X+e.w-6,e.y+10,2,2);g.fillStyle='#fff';g.fillRect(X+4,e.y+10,1,1);g.fillRect(X+e.w-5,e.y+10,1,1)}for(const b of bills){let X=b.x-cam;box(X,b.y,b.w,b.h,'#30394e');box(X+3,b.y+1,10,7,'#d9dee4');box(X+12,b.y+3,2,2,'#ef3b45');box(X-4,b.y+3,5,3,'#e1e5e8')}let flagX=1510-cam;box(flagX,groundY-85,2,85,'#eee');box(flagX+2,groundY-83,31,18,'#e94752');box(flagX+5,groundY-80,15,5,'#ffdc53');let p=player,X=p.x-cam;box(X+3,p.y,8,5,'#e74b44');box(X+2,p.y+5,11,7,'#f5bd72');box(X,p.y+12,14,5,'#d73e45');box(X+2,p.y+17,4,2,'#46365b');box(X+9,p.y+17,4,2,'#46365b');box(X+(p.face>0?9:3),p.y+7,2,2,'#24344d');g.setTransform(1,0,0,1,0,0)}
function loop(now){requestAnimationFrame(loop);let dt=Math.min(.033,(now-last)/1000||0);last=now;tick(dt);draw()}reset();document.querySelector('button').onclick=()=>{started=true;ui.style.display='none'};requestAnimationFrame(loop);
</script></body></html>
